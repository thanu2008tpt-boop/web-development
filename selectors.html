<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <style>
         p {
            color:chartreuse;
         }   

         .thanu {
            color:blue;
            background-color: rgb(250, 101, 9);
         }

         #rithya {
            color:deeppink;
            font-size: 25px;
         }
    </style>
</head>
<body>
    <h1>CSS selectors</h1>

    <p>This is paragraph 1.</p>
    <p>This is paragraph 2.</p>
    <p class="thanu" >This is highlighted text.</p>
    <h2 class="thanu">This heading also uses the class.</h2>

    <p id="rithya">This is special text</p>
</body>
</html>
