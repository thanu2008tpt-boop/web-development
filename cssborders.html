<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Borders</title>
    <style>
        h1 {
            color:rgb(246, 4, 233);
            text-align: none;
        }

        p {
            color:crimson;
            font-size: 20px;
            line-height: 1.5;
        }

        .box1 {
               border: 3px dashed black;   
        }

        .box2 {
               border:5px dotted rgb(117, 27, 242);
        }

        .box3 {
               border:3px double brown;
             }

        .box4 {
               border:5px solid orangered;
               border-radius: 15px;   
        }
    </style>
</head>
<body>
    <h1>CSS Borders</h1>

    <p>This paragraph has a solid border.</p>

    <p class="box1">This is a dashed border.</p>

    <p class="box2">This is a dotted border.</p>

    <p class="box3">This is a double border.</p>

    <p class="box4">This is a rounded border.</p>
</body>
</html>
