<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border task</title>
    <style>
        h1 {
            border: 3px solid blue;
            border-radius:15px ;
        }

        .profile {
            border:3px solid green;
            padding: 10px 15px;
            border-radius:15px ;
        }

        .skills{
            border:3px dashed red;
            padding:15px 20px;
            border-radius:15px ;
            
        }

        h2 {
            border:2px dotted purple;
            border-radius:15px ;
        }

        
        ul {
            color:rgb(26, 250, 49);
            font-size: 18px; 
        }

        li{
            margin: 8px;
        }

        
        ol {
            color:rgb(26, 250, 49);
            font-size: 18px; 
        }

        li{
            margin: 8px;
        }
    </style>
</head>
<body>
    <h1>About my self</h1>
    <div class="profile">
        <ol>
            <li>My name is Thanusri</li>
            <li>I from gajulamandyam</li> 
            <li>I completed my intermediate in tirupati.</li>
            <li>My sister name is Rithyasree.</li>
            <li>She studying 10th class in SSGV. </li>
        </ol>
    </div> 
    <div class="skills">
    <ul>
        <li>HTML</li>
        <li>Python</li>
        <li>Communication skills</li>
        <li>Problem solving</li>
    </ul>
    </div>
    <h2>Favourite movie</h2>
</body>
</html>
