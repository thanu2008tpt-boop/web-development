<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 inputtypes></title>
</head>
<body>
     <input type="password" placeholder="Enter a password"><br>
     <input type="email" placeholder="Enter a email"><br>
     <input type="number" placeholder="Enter a number"><br>
     <input type="date" placeholder="Enter a date"><br>
     <input type="time" placeholder="Enter a time"><br>
     <input type="month" placeholder="Enter a month"><br>
     <input type="week" placeholder="Enter a week "><br>
     <input type="date time-local" placeholder="Enter a date time-local"><br>
     <input type="url" placeholder="Enter a url"><br>
     <input type="tel" placeholder="Enter a tel"><br>
     <input type="search" placeholder="Enter a search"><br>
     <input type="color" placeholder="Enter a color"><br>
     <input type="range" placeholder="Enter a range" ><br>
     <input type="file" placeholder="Enter a file"><br>
     <input type="radio" ><br>
     <input type="checkbox"><br>
     <input type="submit"><br>
     <input type="reset"><br>
     <input type="button"><br>
     <input type="hidden"><br>
</body>
</html>
