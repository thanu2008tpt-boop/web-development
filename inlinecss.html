<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INLINE CSS</title>
</head>
<body>
    <h1 style="color:blue;text-align:center;">
        My website
    </h1>

    <!--The style is applied directly to this paragraph-->
    <p style="color:rgb(51, 248, 51); font-size: 20px">
        This is an example of Inline CSS.
    </p>

    <!-- Another element with its own style-->
     <button style="background-color: black;color:white;">
        Click me
     </button>
</body>
</html>
